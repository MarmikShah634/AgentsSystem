version: 1
name: agentic-dev-system
description: >
  Orchestrator-managed multi-agent SDLC. Source of truth lives in the
  repository root under agents/, skills/, hooks/, commands/. This file is
  regenerated by scripts/sync-platforms.sh.

confidence_floor: 0.90

agents_dir: ./agents
skills_dir: ./skills
commands_dir: ./commands

lifecycle:
  pre_task: ../hooks/pre-task-plan.sh
  post_task: ../hooks/post-task-log.sh
  post_edit: ../hooks/post-edit-test.sh
  pre_commit: ../hooks/pre-commit-test.sh
  pre_deploy: ../hooks/pre-deploy-check.sh
  on_response: ../hooks/confidence-gate.sh

sensitive_globs:
  - "secrets/**"
  - "infra/**"
  - "migrations/**"
  - "**/.env*"
  - "**/Dockerfile"
  - "**/*.tf"
